<template id="captions-template">
  <div data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="sub-stage"></div>
    <style>
      [data-composition-id="captions"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: visible;
        background: transparent;
        font-family: "Montserrat", sans-serif;
      }
      #sub-stage {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }
      .sub-group {
        position: absolute;
        left: 90px;
        width: 840px;
        top: 1080px;
        height: 220px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-end;
        justify-content: center;
        column-gap: 16px;
        row-gap: 6px;
        opacity: 0;
        overflow: visible;
      }
      .sub-word {
        display: inline-block;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.12;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
        opacity: 0;
        white-space: nowrap;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        function cargarPalabras() {
          if (Array.isArray(window.BASE_PALABRAS)) return window.BASE_PALABRAS;
          var rutas = ["base-palabras.json", "../base-palabras.json"];
          for (var i = 0; i < rutas.length; i++) {
            try {
              var xhr = new XMLHttpRequest();
              xhr.open("GET", rutas[i], false);
              xhr.send(null);
              if (xhr.status >= 200 && xhr.status < 300) {
                var parsed = JSON.parse(xhr.responseText);
                if (Array.isArray(parsed)) return parsed;
              }
            } catch (e) {}
          }
          return [];
        }

        function ajustarTamano(texto, base, min, maxAncho) {
          if (window.__hyperframes && typeof window.__hyperframes.fitTextFontSize === "function") {
            var res = window.__hyperframes.fitTextFontSize(texto, {
              fontFamily: "Montserrat",
              fontWeight: 700,
              baseFontSize: base,
              minFontSize: min,
              maxWidth: maxAncho,
              step: 2,
            });
            if (res && res.fontSize) return Math.min(base, Math.max(min, res.fontSize));
          }
          var estimado = texto.length * base * 0.58;
          if (estimado <= maxAncho) return base;
          return Math.max(min, Math.floor((base * maxAncho) / estimado));
        }

        var palabras = cargarPalabras();
        var stage = document.getElementById("sub-stage");
        var grupos = [];
        var actual = [];

        for (var i = 0; i < palabras.length; i++) {
          var p = palabras[i];
          var prev = actual.length ? actual[actual.length - 1] : null;
          var pausa = prev ? p.s - prev.e : 0;
          var finFrase = prev && /[.!?,;:]$/.test(prev.w);
          var largoActual = actual.map(function (x) { return x.w; }).join(" ").length;
          if (actual.length && (actual.length >= 3 || pausa >= 0.26 || finFrase || largoActual + 1 + p.w.length > 18)) {
            grupos.push(actual);
            actual = [];
          }
          actual.push(p);
        }
        if (actual.length) grupos.push(actual);

        grupos.forEach(function (g, gi) {
          var texto = g.map(function (w) { return w.w; }).join(" ");
          var tam = ajustarTamano(texto, 68, 56, 820);
          var gEl = document.createElement("div");
          gEl.className = "sub-group";
          gEl.id = "limpio-g-" + gi;

          var spans = g.map(function (w, wi) {
            var sp = document.createElement("span");
            sp.className = "sub-word";
            sp.id = "limpio-w-" + gi + "-" + wi;
            sp.style.fontSize = tam + "px";
            sp.textContent = w.w;
            gEl.appendChild(sp);
            return { el: sp, s: w.s, e: w.e };
          });
          stage.appendChild(gEl);

          var inicio = g[0].s;
          var sig = grupos[gi + 1];
          var finBase = Math.max(g[g.length - 1].e + 0.45, inicio + 0.26);
          var fin = sig ? Math.min(finBase, Math.max(inicio + 0.12, sig[0].s - 0.01)) : finBase;

          tl.set(gEl, { opacity: 1 }, inicio);
          spans.forEach(function (w) {
            var dur = Math.max(0.08, Math.min(0.18, (w.e - w.s) * 0.6));
            tl.fromTo(
              w.el,
              { opacity: 0, y: 5 },
              { opacity: 1, y: 0, duration: dur, ease: "power3.out" },
              w.s
            );
          });
          tl.set(gEl, { opacity: 0 }, fin);
        });

        tl.seek(0);
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
</template>
