<template id="captions-template">
  <div data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="sub-stage"></div>
    <style>
      [data-composition-id="captions"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: visible;
        background: transparent;
        font-family: "Outfit", sans-serif;
      }
      #sub-stage {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }
      .sub-group {
        position: absolute;
        left: 90px;
        width: 840px;
        top: 1070px;
        height: 230px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-end;
        justify-content: center;
        column-gap: 16px;
        row-gap: 8px;
        opacity: 0;
        overflow: visible;
      }
      .sub-word {
        display: inline-block;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.16;
        color: rgba(255, 255, 255, 0.62);
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.58);
        white-space: nowrap;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var COLOR_ACTIVO = "#38BDF8";
        var COLOR_HECHO = "#FFFFFF";
        var SOMBRA_BASE = "0 3px 12px rgba(0, 0, 0, 0.58)";
        var SOMBRA_ACTIVA = "0 0 18px rgba(56, 189, 248, 0.35), 0 3px 12px rgba(0, 0, 0, 0.65)";

        function cargarPalabras() {
          if (Array.isArray(window.BASE_PALABRAS)) return window.BASE_PALABRAS;
          var rutas = ["base-palabras.json", "../base-palabras.json"];
          for (var i = 0; i < rutas.length; i++) {
            try {
              var xhr = new XMLHttpRequest();
              xhr.open("GET", rutas[i], false);
              xhr.send(null);
              if (xhr.status >= 200 && xhr.status < 300) {
                var parsed = JSON.parse(xhr.responseText);
                if (Array.isArray(parsed)) return parsed;
              }
            } catch (e) {}
          }
          return [];
        }

        function ajustarTamano(texto, base, min, maxAncho) {
          if (window.__hyperframes && typeof window.__hyperframes.fitTextFontSize === "function") {
            var res = window.__hyperframes.fitTextFontSize(texto, {
              fontFamily: "Outfit",
              fontWeight: 800,
              baseFontSize: base,
              minFontSize: min,
              maxWidth: maxAncho,
              step: 2,
            });
            if (res && res.fontSize) return Math.min(base, Math.max(min, res.fontSize));
          }
          var estimado = texto.length * base * 0.56;
          if (estimado <= maxAncho) return base;
          return Math.max(min, Math.floor((base * maxAncho) / estimado));
        }

        var palabras = cargarPalabras();
        var stage = document.getElementById("sub-stage");
        var grupos = [];
        var actual = [];

        for (var i = 0; i < palabras.length; i++) {
          var p = palabras[i];
          var prev = actual.length ? actual[actual.length - 1] : null;
          var pausa = prev ? p.s - prev.e : 0;
          var finFrase = prev && /[.!?,;:]$/.test(prev.w);
          var largoActual = actual.map(function (x) { return x.w; }).join(" ").length;
          if (actual.length && (actual.length >= 4 || pausa >= 0.26 || finFrase || largoActual + 1 + p.w.length > 22)) {
            grupos.push(actual);
            actual = [];
          }
          actual.push(p);
        }
        if (actual.length) grupos.push(actual);

        grupos.forEach(function (g, gi) {
          var texto = g.map(function (w) { return w.w; }).join(" ");
          var tam = ajustarTamano(texto, 72, 56, 770);
          var gEl = document.createElement("div");
          gEl.className = "sub-group";
          gEl.id = "karaoke-g-" + gi;

          var spans = g.map(function (w, wi) {
            var sp = document.createElement("span");
            sp.className = "sub-word";
            sp.id = "karaoke-w-" + gi + "-" + wi;
            sp.style.fontSize = tam + "px";
            sp.textContent = w.w;
            gEl.appendChild(sp);
            return { el: sp, s: w.s, e: w.e };
          });
          stage.appendChild(gEl);

          var inicio = g[0].s;
          var sig = grupos[gi + 1];
          var finBase = Math.max(g[g.length - 1].e + 0.45, inicio + 0.26);
          var fin = sig ? Math.min(finBase, Math.max(inicio + 0.16, sig[0].s - 0.01)) : finBase;
          var durEntrada = Math.min(0.14, Math.max(0.06, (fin - inicio) * 0.4));

          tl.fromTo(
            gEl,
            { opacity: 0, y: 6 },
            { opacity: 1, y: 0, duration: durEntrada, ease: "power2.out" },
            inicio
          );

          spans.forEach(function (w, wi) {
            var durPalabra = Math.max(0.08, w.e - w.s);
            var tIn = Math.min(0.09, durPalabra * 0.45);
            tl.to(
              w.el,
              { color: COLOR_ACTIVO, scale: 1.08, textShadow: SOMBRA_ACTIVA, duration: tIn, ease: "power2.out" },
              w.s
            );
            var sigPalabra = spans[wi + 1];
            var finResalte = sigPalabra ? Math.min(w.e, sigPalabra.s) : w.e;
            var tSalida = Math.max(w.s + tIn + 0.01, finResalte);
            if (tSalida < fin - 0.02) {
              var tOut = Math.min(0.09, Math.max(0.03, fin - tSalida - 0.01));
              tl.to(
                w.el,
                { color: COLOR_HECHO, scale: 1, textShadow: SOMBRA_BASE, duration: tOut, ease: "power1.out" },
                tSalida
              );
            }
          });

          tl.set(gEl, { opacity: 0 }, fin);
        });

        tl.seek(0);
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
</template>
