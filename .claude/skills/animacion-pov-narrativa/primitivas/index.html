<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Movimientos de animación POV cel</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="pov.js"></script>
<style>
body { margin: 0; }
#pov-muestra { position: relative; overflow: hidden; background: #a1bcda; color: #fff; font: bold 22px Arial, sans-serif; }
.plane, .wipe, .end { position: absolute; inset: 0; }
.far { background: linear-gradient(#a1bcda 44%, #457c77 44%); }
.mid { clip-path: polygon(48% 45%, 53% 45%, 94% 100%, 5% 100%); background: #cdb28b; }
.near { display: grid; place-items: center; }
.goal { margin-top: -60px; border: 4px solid #22353f; background: #a83c34; padding: 16px 25px; }
.hand { position: absolute; bottom: -21px; right: -15px; width: 105px; height: 150px; transform-origin: right bottom; }
.wipe, .end { opacity: 0; }
.end { display: flex; flex-direction: column; justify-content: center; align-items: center; background: #101e2bd1; gap: 14px; }
.choice { width: 72%; background: #26679f; padding: 13px; border-radius: 5px; }
.choice + .choice { background: #a83c34; }
</style>
</head>
<body>
<main id="pov-muestra" data-composition-id="pov-muestra" data-start="0" data-duration="6" data-width="360" data-height="640">
  <div class="plane far"></div><div class="plane mid"></div><div class="plane near"><div class="goal">Abrí la puerta</div></div>
  <svg class="hand" viewBox="0 0 160 200" aria-hidden="true"><path fill="#bb875e" stroke="#33343d" stroke-width="4" d="M160 200 88 200 58 120 26 88q-14-14-2-23l27 21-18-43q-2-13 9-14l23 37-9-51q4-14 15-8l17 50 6-31q10-13 17 0l-3 55 14-10q16-2 14 14l-22 45z"/></svg>
  <div class="wipe"></div>
  <div class="end"><div>¿Qué sigue?</div><div class="choice">Editar</div><div class="choice">Exportar</div></div>
</main>
<script>
const tl = gsap.timeline({paused:true});
const root = document.querySelector("#pov-muestra");
PovCel.camera(tl, root.querySelectorAll(".plane"), [
  {at:0}, {at:1.3, y:12, zoom:1.07, roll:2}, {at:3, x:-11, y:-18, zoom:1.13, roll:-4}, {at:6, x:4, y:2}
]);
PovCel.reach(tl, root.querySelector(".hand"), 1.3, {x:-105, y:-225, rotation:-14});
PovCel.whip(tl, root.querySelector(".wipe"), 3.0);
PovCel.endCard(tl, root.querySelector(".end"), 4.3);
window.__timelines = {"pov-muestra": tl};
</script>
</body>
</html>
